<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap" rel="stylesheet">
<link href="base.css" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Baram Docs</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
    }

    .page {
      min-height: 100vh;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
      overflow: hidden;
    }

    .topbar,
    .toolbar,
    .left-controls,
    .right-controls,
    .statusbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .topbar {
      justify-content: space-between;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 180px;
    }

    .field input {
      width: 100%;
    }

    .workspace {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #hybridEditor {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 8px;
      line-height: 1.5;
    }

    .line {
      display: block;
      min-height: 1.5em;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .line.h1 {
      font-size: 1.35em;
      font-weight: 700;
    }

    .line.h2 {
      font-size: 1.2em;
      font-weight: 700;
    }

    .line.h3 {
      font-size: 1.05em;
      font-weight: 700;
    }

    .line.quote {
      font-style: italic;
    }

    .line.list,
    .line.olist {
      padding-left: 1ch;
    }

    .md-token {
      opacity: 0.3;
    }

    .statusbar {
      min-height: 24px;
      justify-content: space-between;
    }

    @media (max-width: 900px) {
      .topbar {
        align-items: stretch;
      }

      .left-controls,
      .right-controls {
        width: 100%;
      }

      .field {
        min-width: 140px;
        flex: 1;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="topbar">
      <div class="left-controls">
        <button type="button" id="backBtn">
          <img src="logo.png">
        </button>
        <label class="field">
          <input id="projectName" type="text" />
        </label>
      </div>

      <div class="right-controls">
        <button type="button" id="downloadBtn">.md ダウンロード</button>
      </div>
    </header>

    <section class="toolbar" role="group" aria-label="markdown helpers">
      <button type="button" id="undoBtn"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000"><path d="M280-200v-80h284q63 0 109.5-40T720-420q0-60-46.5-100T564-560H312l104 104-56 56-200-200 200-200 56 56-104 104h252q97 0 166.5 63T800-420q0 94-69.5 157T564-200H280Z"/></svg></button>
      <button type="button" id="redoBtn"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000"><path d="M396-200q-97 0-166.5-63T160-420q0-94 69.5-157T396-640h252L544-744l56-56 200 200-200 200-56-56 104-104H396q-63 0-109.5 40T240-420q0 60 46.5 100T396-280h284v80H396Z"/></svg></button>
      <button type="button" class="fmt-btn" data-kind="line" data-prefix="# "><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000"><path d="M200-280v-400h80v160h160v-160h80v400h-80v-160H280v160h-80Zm480 0v-320h-80v-80h160v400h-80Z"/></svg></button>
      <button type="button" class="fmt-btn" data-kind="line" data-prefix="## "><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000"><path d="M120-280v-400h80v160h160v-160h80v400h-80v-160H200v160h-80Zm400 0v-160q0-33 23.5-56.5T600-520h160v-80H520v-80h240q33 0 56.5 23.5T840-600v80q0 33-23.5 56.5T760-440H600v80h240v80H520Z"/></svg></button>
      <button type="button" class="fmt-btn" data-kind="wrap" data-prefix="**" data-suffix="**"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000"><path d="M272-200v-560h221q65 0 120 40t55 111q0 51-23 78.5T602-491q25 11 55.5 41t30.5 90q0 89-65 124.5T501-200H272Zm121-112h104q48 0 58.5-24.5T566-372q0-11-10.5-35.5T494-432H393v120Zm0-228h93q33 0 48-17t15-38q0-24-17-39t-44-15h-95v109Z"/></svg></button>
      <button type="button" class="fmt-btn" data-kind="wrap" data-prefix="*" data-suffix="*"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000"><path d="M200-200v-100h160l120-360H320v-100h400v100H580L460-300h140v100H200Z"/></svg></button>
      <button type="button" class="fmt-btn" data-kind="line" data-prefix="- "><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000"><path d="M360-200v-80h480v80H360Zm0-240v-80h480v80H360Zm0-240v-80h480v80H360ZM200-160q-33 0-56.5-23.5T120-240q0-33 23.5-56.5T200-320q33 0 56.5 23.5T280-240q0 33-23.5 56.5T200-160Zm0-240q-33 0-56.5-23.5T120-480q0-33 23.5-56.5T200-560q33 0 56.5 23.5T280-480q0 33-23.5 56.5T200-400Zm-56.5-263.5Q120-687 120-720t23.5-56.5Q167-800 200-800t56.5 23.5Q280-753 280-720t-23.5 56.5Q233-640 200-640t-56.5-23.5Z"/></svg></button>
      <button type="button" class="fmt-btn" data-kind="line" data-prefix="1. "><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000"><path d="M120-80v-60h100v-30h-60v-60h60v-30H120v-60h120q17 0 28.5 11.5T280-280v40q0 17-11.5 28.5T240-200q17 0 28.5 11.5T280-160v40q0 17-11.5 28.5T240-80H120Zm0-280v-110q0-17 11.5-28.5T160-510h60v-30H120v-60h120q17 0 28.5 11.5T280-560v70q0 17-11.5 28.5T240-450h-60v30h100v60H120Zm60-280v-180h-60v-60h120v240h-60Zm180 440v-80h480v80H360Zm0-240v-80h480v80H360Zm0-240v-80h480v80H360Z"/></svg></button>
      <button type="button" class="fmt-btn" data-kind="line" data-prefix="> "><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000"><path d="M200-200h560v-367L567-760H200v560Zm0 80q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h400l240 240v400q0 33-23.5 56.5T760-120H200Zm80-160h400v-80H280v80Zm0-160h400v-80H280v80Zm0-160h280v-80H280v80Zm-80 400v-560 560Z"/></svg></button>
      <button type="button" class="fmt-btn" data-kind="wrap" data-prefix="`" data-suffix="`"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000"><path d="m384-336 56-57-87-87 87-87-56-57-144 144 144 144Zm192 0 144-144-144-144-56 57 87 87-87 87 56 57ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm0-560v560-560Z"/></svg></button>
      <button type="button" id="insertLinkBtn"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000"><path d="M440-280H280q-83 0-141.5-58.5T80-480q0-83 58.5-141.5T280-680h160v80H280q-50 0-85 35t-35 85q0 50 35 85t85 35h160v80ZM320-440v-80h320v80H320Zm200 160v-80h160q50 0 85-35t35-85q0-50-35-85t-85-35H520v-80h160q83 0 141.5 58.5T880-480q0 83-58.5 141.5T680-280H520Z"/></svg></button>
    </section>

    <section class="workspace">
      <div id="hybridEditor" contenteditable="true" spellcheck="false" aria-label="Markdown hybrid editor"></div>
    </section>

    <footer class="statusbar">
      <span id="statusText">Ready</span>
      <span>Hybrid Markdown WYSIWYG</span>
    </footer>
  </main>

  <script>
    const DB_KEY = "baram-docs-v1";
    const DEFAULT_NAME = "Baram Docs";
    const DEFAULT_CONTENT = "# New Document\n\nWrite your markdown here.\n";

    const params = new URLSearchParams(window.location.search);

    const backBtn = document.getElementById("backBtn");
    const projectNameInput = document.getElementById("projectName");
    const downloadBtn = document.getElementById("downloadBtn");
    const undoBtn = document.getElementById("undoBtn");
    const redoBtn = document.getElementById("redoBtn");
    const hybridEditor = document.getElementById("hybridEditor");
    const statusText = document.getElementById("statusText");
    const insertLinkBtn = document.getElementById("insertLinkBtn");

    let project = null;
    let sourceText = "";
    let isRendering = false;
    let isComposing = false;
    let isApplyingHistory = false;
    let historyTimer = null;
    const history = { stack: [], index: -1 };

    function createId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }
      return `id-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function nowIso() {
      return new Date().toISOString();
    }

    function normalizeText(text) {
      return String(text || "").replace(/\r\n?/g, "\n");
    }

    function createProject(name) {
      const now = nowIso();
      return {
        id: createId(),
        name: name || DEFAULT_NAME,
        content: DEFAULT_CONTENT,
        createdAt: now,
        updatedAt: now,
      };
    }

    function loadDb() {
      try {
        const raw = localStorage.getItem(DB_KEY);
        const parsed = raw ? JSON.parse(raw) : null;
        if (!parsed || typeof parsed !== "object") {
          return { projects: {}, lastProjectId: null };
        }
        if (!parsed.projects || typeof parsed.projects !== "object") {
          parsed.projects = {};
        }
        if (!Object.prototype.hasOwnProperty.call(parsed, "lastProjectId")) {
          parsed.lastProjectId = null;
        }
        return parsed;
      } catch (_error) {
        return { projects: {}, lastProjectId: null };
      }
    }

    function saveDb(db) {
      localStorage.setItem(DB_KEY, JSON.stringify(db));
    }

    function updateStatus(message) {
      statusText.textContent = message;
    }

    function saveProject() {
      project.updatedAt = nowIso();
      db.projects[project.id] = project;
      db.lastProjectId = project.id;
      saveDb(db);
      updateStatus(`Saved: ${new Date(project.updatedAt).toLocaleTimeString("ja-JP")}`);
    }

    function scheduleSave() {
      updateStatus("Saving...");
      if (scheduleSave.timer) window.clearTimeout(scheduleSave.timer);
      scheduleSave.timer = window.setTimeout(saveProject, 1200);
    }

    function getDownloadFilename() {
      const stem = String(project.name || DEFAULT_NAME)
        .trim()
        .replace(/[\\/:*?"<>|]+/g, "-")
        .replace(/\s+/g, " ") || DEFAULT_NAME;
      return `${stem}.md`;
    }

    function updateHistoryButtons() {
      undoBtn.disabled = history.index <= 0;
      redoBtn.disabled = history.index >= history.stack.length - 1;
    }

    function queueHistorySnapshot() {
      if (isApplyingHistory) return;
      if (historyTimer) window.clearTimeout(historyTimer);
      historyTimer = window.setTimeout(() => pushHistorySnapshot(false), 450);
    }

    function pushHistorySnapshot(force) {
      if (isApplyingHistory) return;
      if (historyTimer) {
        window.clearTimeout(historyTimer);
        historyTimer = null;
      }

      const snapshot = sourceText;
      if (!force && history.index >= 0 && history.stack[history.index] === snapshot) {
        updateHistoryButtons();
        return;
      }

      if (history.index < history.stack.length - 1) {
        history.stack = history.stack.slice(0, history.index + 1);
      }

      history.stack.push(snapshot);
      if (history.stack.length > 120) {
        history.stack.shift();
      }
      history.index = history.stack.length - 1;
      updateHistoryButtons();
    }

    function applyHistory(index) {
      if (index < 0 || index >= history.stack.length) return;
      isApplyingHistory = true;
      history.index = index;
      sourceText = history.stack[index];
      project.content = sourceText;
      hybridEditor.innerHTML = renderSource();
      setSelectionByOffsets(sourceText.length, sourceText.length);
      isApplyingHistory = false;
      updateHistoryButtons();
      scheduleSave();
    }

    function undo() {
      if (history.index <= 0) return;
      applyHistory(history.index - 1);
    }

    function redo() {
      if (history.index >= history.stack.length - 1) return;
      applyHistory(history.index + 1);
    }

    function escapeHtml(text) {
      return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function protect(text, renderer, store) {
      return text.replace(renderer.regex, (...args) => {
        const html = renderer.toHtml(...args);
        const id = store.length;
        store.push(html);
        return `@@${renderer.key}${id}@@`;
      });
    }

    function restoreProtected(text, store) {
      return text.replace(/@@[A-Z]+(\d+)@@/g, (_m, id) => store[Number(id)] || "");
    }

    function renderInline(rawLine) {
      const store = [];
      let line = escapeHtml(rawLine);

      line = protect(line, {
        key: "CODE",
        regex: /`([^`\n]+?)`/g,
        toHtml: (_m, inner) => `<code><span class="md-token">\`</span>${inner}<span class="md-token">\`</span></code>`,
      }, store);

      line = protect(line, {
        key: "LINK",
        regex: /\[([^\]]+?)\]\(([^)]+?)\)/g,
        toHtml: (_m, label, url) => `<a href="${url}" target="_blank" rel="noopener"><span class="md-token">[</span>${label}<span class="md-token">]</span><span class="md-token">(</span>${url}<span class="md-token">)</span></a>`,
      }, store);

      line = protect(line, {
        key: "BOLD",
        regex: /\*\*([^*\n]+?)\*\*/g,
        toHtml: (_m, inner) => `<strong><span class="md-token">**</span>${inner}<span class="md-token">**</span></strong>`,
      }, store);

      line = protect(line, {
        key: "ITAL",
        regex: /\*([^*\n]+?)\*/g,
        toHtml: (_m, inner) => `<em><span class="md-token">*</span>${inner}<span class="md-token">*</span></em>`,
      }, store);

      return restoreProtected(line, store);
    }

    function renderLine(line) {
      const headingMatch = line.match(/^(#{1,6})(\s+)(.*)$/);
      if (headingMatch) {
        const level = Math.min(3, headingMatch[1].length);
        const token = `${escapeHtml(headingMatch[1])}${escapeHtml(headingMatch[2])}`;
        const content = renderInline(headingMatch[3]);
        return `<div class="line h${level}"><span class="md-token">${token}</span>${content || ""}</div>`;
      }

      const quoteMatch = line.match(/^(>\s?)(.*)$/);
      if (quoteMatch) {
        return `<div class="line quote"><span class="md-token">${escapeHtml(quoteMatch[1])}</span>${renderInline(quoteMatch[2])}</div>`;
      }

      const ulistMatch = line.match(/^([-*]\s+)(.*)$/);
      if (ulistMatch) {
        return `<div class="line list"><span class="md-token">${escapeHtml(ulistMatch[1])}</span>${renderInline(ulistMatch[2])}</div>`;
      }

      const olistMatch = line.match(/^(\d+\.\s+)(.*)$/);
      if (olistMatch) {
        return `<div class="line olist"><span class="md-token">${escapeHtml(olistMatch[1])}</span>${renderInline(olistMatch[2])}</div>`;
      }

      if (line === "") {
        return `<div class="line"><br></div>`;
      }

      return `<div class="line">${renderInline(line)}</div>`;
    }

    function renderSource() {
      const lines = normalizeText(sourceText).split("\n");
      return lines.map(renderLine).join("");
    }

    function getLineElements() {
      return Array.from(hybridEditor.querySelectorAll(".line"));
    }

    function extractSourceFromEditor() {
      const lines = getLineElements();
      if (!lines.length) return "";
      return lines.map((line) => normalizeText((line.textContent || "").replace(/\u00A0/g, " "))).join("\n");
    }

    function buildLineStarts(text) {
      const lines = normalizeText(text).split("\n");
      const starts = [];
      let total = 0;
      for (let i = 0; i < lines.length; i += 1) {
        starts.push(total);
        total += lines[i].length;
        if (i < lines.length - 1) total += 1;
      }
      return { lines, starts, total };
    }

    function closestLineElement(node) {
      if (!node) return null;
      if (node.nodeType === Node.ELEMENT_NODE) {
        if (node.classList && node.classList.contains("line")) return node;
        if (typeof node.closest === "function") return node.closest(".line");
        return null;
      }
      if (node.parentElement) return node.parentElement.closest(".line");
      return null;
    }

    function pointToOffset(container, offset, lineMap) {
      const lineEls = getLineElements();
      if (!lineEls.length) return 0;

      let lineEl = closestLineElement(container);
      if (!lineEl && container === hybridEditor) {
        const childIndex = Math.max(0, Math.min(offset - 1, hybridEditor.childNodes.length - 1));
        const child = hybridEditor.childNodes[childIndex];
        lineEl = closestLineElement(child) || lineEls[lineEls.length - 1];
      }
      if (!lineEl) return lineMap.total;

      const lineIndex = lineEls.indexOf(lineEl);
      if (lineIndex < 0) return lineMap.total;

      const localRange = document.createRange();
      localRange.selectNodeContents(lineEl);
      try {
        localRange.setEnd(container, offset);
      } catch (_error) {
        return lineMap.starts[lineIndex] + lineMap.lines[lineIndex].length;
      }

      const localLen = normalizeText(localRange.toString().replace(/\u00A0/g, " ")).length;
      const capped = Math.max(0, Math.min(localLen, lineMap.lines[lineIndex].length));
      return lineMap.starts[lineIndex] + capped;
    }

    function getSelectionOffsets(textForOffsets = sourceText) {
      const lineMap = buildLineStarts(textForOffsets);
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) {
        return { start: lineMap.total, end: lineMap.total };
      }
      const range = sel.getRangeAt(0);
      return {
        start: pointToOffset(range.startContainer, range.startOffset, lineMap),
        end: pointToOffset(range.endContainer, range.endOffset, lineMap),
      };
    }

    function lineOffsetToDom(lineEl, offsetInLine) {
      const walker = document.createTreeWalker(lineEl, NodeFilter.SHOW_TEXT);
      let node = walker.nextNode();
      let remaining = offsetInLine;
      while (node) {
        const len = normalizeText((node.nodeValue || "").replace(/\u00A0/g, " ")).length;
        if (remaining <= len) {
          return { node, offset: remaining };
        }
        remaining -= len;
        node = walker.nextNode();
      }
      return { node: lineEl, offset: lineEl.childNodes.length };
    }

    function absoluteOffsetToPoint(targetOffset) {
      const lineMap = buildLineStarts(sourceText);
      const lineEls = getLineElements();
      if (!lineEls.length) return { node: hybridEditor, offset: 0 };
      const safe = Math.max(0, Math.min(targetOffset, lineMap.total));

      for (let i = 0; i < lineMap.lines.length; i += 1) {
        const lineStart = lineMap.starts[i];
        const lineLen = lineMap.lines[i].length;
        const isLast = i === lineMap.lines.length - 1;
        const lineEnd = lineStart + lineLen;
        if (safe <= lineEnd || isLast) {
          const offsetInLine = Math.max(0, Math.min(safe - lineStart, lineLen));
          const lineEl = lineEls[i] || lineEls[lineEls.length - 1];
          return lineOffsetToDom(lineEl, offsetInLine);
        }
      }

      const fallbackLine = lineEls[lineEls.length - 1];
      return { node: fallbackLine, offset: fallbackLine.childNodes.length };
    }

    function setSelectionByOffsets(start, end) {
      const sel = window.getSelection();
      if (!sel) return;
      const range = document.createRange();
      const startPoint = absoluteOffsetToPoint(start);
      const endPoint = absoluteOffsetToPoint(end);

      try {
        range.setStart(startPoint.node, startPoint.offset);
        range.setEnd(endPoint.node, endPoint.offset);
      } catch (_error) {
        range.selectNodeContents(hybridEditor);
        range.collapse(false);
      }
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function syncFromEditorInput() {
      if (isRendering || isComposing) return;
      const nextText = normalizeText(extractSourceFromEditor());
      const selection = getSelectionOffsets(nextText);
      sourceText = nextText;
      project.content = sourceText;
      const html = renderSource();

      isRendering = true;
      hybridEditor.innerHTML = html;
      setSelectionByOffsets(selection.start, selection.end);
      isRendering = false;

      queueHistorySnapshot();
      scheduleSave();
    }

    function insertPlainTextAtSelection(text, selectStartOffset = text.length, selectEndOffset = text.length) {
      const selection = getSelectionOffsets();
      const start = Math.min(selection.start, selection.end);
      const end = Math.max(selection.start, selection.end);

      sourceText = `${sourceText.slice(0, start)}${text}${sourceText.slice(end)}`;
      project.content = sourceText;

      isRendering = true;
      hybridEditor.innerHTML = renderSource();
      setSelectionByOffsets(start + selectStartOffset, start + selectEndOffset);
      isRendering = false;

      pushHistorySnapshot(true);
      scheduleSave();
    }

    function handleEditorBeforeInput(event) {
      if (isRendering || isComposing) return;
      if (event.inputType !== "insertParagraph" && event.inputType !== "insertLineBreak") return;
      if (!hybridEditor.contains(event.target)) return;
      event.preventDefault();
      event.stopPropagation();
      insertPlainTextAtSelection("\n");
    }

    function handleEditorEnterKey(event) {
      if (isRendering || isComposing || event.key !== "Enter") return false;
      if (!hybridEditor.contains(event.target)) return false;
      event.preventDefault();
      event.stopPropagation();
      insertPlainTextAtSelection("\n");
      return true;
    }

    function applyWrap(prefix, suffix) {
      const selection = getSelectionOffsets();
      const start = Math.min(selection.start, selection.end);
      const end = Math.max(selection.start, selection.end);
      const selected = sourceText.slice(start, end);

      sourceText = `${sourceText.slice(0, start)}${prefix}${selected}${suffix}${sourceText.slice(end)}`;
      project.content = sourceText;

      isRendering = true;
      hybridEditor.innerHTML = renderSource();
      setSelectionByOffsets(start + prefix.length, start + prefix.length + selected.length);
      isRendering = false;

      pushHistorySnapshot(true);
      scheduleSave();
    }

    function applyLinePrefix(prefix) {
      const selection = getSelectionOffsets();
      const start = Math.min(selection.start, selection.end);
      const end = Math.max(selection.start, selection.end);

      const lineStart = sourceText.lastIndexOf("\n", Math.max(0, start - 1)) + 1;
      const lineEndIndex = sourceText.indexOf("\n", end);
      const lineEnd = lineEndIndex === -1 ? sourceText.length : lineEndIndex;
      const block = sourceText.slice(lineStart, lineEnd);
      const replaced = block.split("\n").map((line) => prefix + line).join("\n");

      sourceText = `${sourceText.slice(0, lineStart)}${replaced}${sourceText.slice(lineEnd)}`;
      project.content = sourceText;

      isRendering = true;
      hybridEditor.innerHTML = renderSource();
      setSelectionByOffsets(lineStart, lineStart + replaced.length);
      isRendering = false;

      pushHistorySnapshot(true);
      scheduleSave();
    }

    function insertLink() {
      const url = window.prompt("URL");
      if (!url) return;
      const selection = getSelectionOffsets();
      const start = Math.min(selection.start, selection.end);
      const end = Math.max(selection.start, selection.end);
      const selected = sourceText.slice(start, end) || "link";
      const next = `[${selected}](${url})`;

      sourceText = `${sourceText.slice(0, start)}${next}${sourceText.slice(end)}`;
      project.content = sourceText;

      isRendering = true;
      hybridEditor.innerHTML = renderSource();
      setSelectionByOffsets(start, start + next.length);
      isRendering = false;

      pushHistorySnapshot(true);
      scheduleSave();
    }

    function downloadTextFile(filename, content, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    const db = loadDb();
    let projectId = params.get("id") || db.lastProjectId;
    project = projectId ? db.projects[projectId] : null;

    if (!project) {
      project = createProject(DEFAULT_NAME);
      db.projects[project.id] = project;
      projectId = project.id;
    }

    db.lastProjectId = project.id;
    saveDb(db);

    if (project.id !== params.get("id")) {
      params.set("id", project.id);
      const nextUrl = `${window.location.pathname}?${params.toString()}`;
      window.history.replaceState({}, "", nextUrl);
    }

    projectNameInput.value = project.name || DEFAULT_NAME;
    document.title = `${projectNameInput.value} | Baram Docs`;

    sourceText = normalizeText(project.content || DEFAULT_CONTENT);
    hybridEditor.innerHTML = renderSource();
    pushHistorySnapshot(true);

    backBtn.addEventListener("click", () => {
      project.content = sourceText;
      saveProject();
      window.location.href = "../index-new.html";
    });

    projectNameInput.addEventListener("input", () => {
      project.name = projectNameInput.value.trim() || DEFAULT_NAME;
      document.title = `${project.name} | Baram Docs`;
      scheduleSave();
    });

    hybridEditor.addEventListener("compositionstart", () => {
      isComposing = true;
    });

    hybridEditor.addEventListener("compositionend", () => {
      isComposing = false;
      syncFromEditorInput();
    });

    hybridEditor.addEventListener("input", syncFromEditorInput);
    hybridEditor.addEventListener("beforeinput", handleEditorBeforeInput);
    document.addEventListener("beforeinput", handleEditorBeforeInput, true);
    document.addEventListener("keydown", handleEditorEnterKey, true);

    hybridEditor.addEventListener("keydown", (event) => {
      if (handleEditorEnterKey(event)) return;

      const ctrlMeta = event.ctrlKey || event.metaKey;
      if (!ctrlMeta) return;
      const key = event.key.toLowerCase();
      if (!event.shiftKey && key === "z") {
        event.preventDefault();
        undo();
        return;
      }
      if (key === "y" || (event.shiftKey && key === "z")) {
        event.preventDefault();
        redo();
      }
    });

    document.querySelectorAll(".fmt-btn").forEach((button) => {
      button.addEventListener("click", () => {
        const kind = button.dataset.kind;
        if (kind === "wrap") {
          applyWrap(button.dataset.prefix || "", button.dataset.suffix || "");
          return;
        }
        applyLinePrefix(button.dataset.prefix || "");
      });
    });

    insertLinkBtn.addEventListener("click", insertLink);
    undoBtn.addEventListener("click", undo);
    redoBtn.addEventListener("click", redo);

    downloadBtn.addEventListener("click", () => {
      project.content = sourceText;
      saveProject();
      downloadTextFile(getDownloadFilename(), sourceText || "", "text/markdown;charset=utf-8");
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") {
        project.content = sourceText;
        saveProject();
      }
    });

    window.addEventListener("beforeunload", () => {
      project.content = sourceText;
      saveProject();
    });

    updateStatus("Ready");
  </script>
</body>

</html>
